# Pull requests run the short check; main runs the full check.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@6dafb764a6cb35d60a1d8cd6e21877cb94608726 # v0.6.160
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
