# Pull requests run the short check; main runs the full check.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@da7d6fd99e4fe8ed90e59a970043bde90486190d # v0.6.103
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
